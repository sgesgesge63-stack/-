<style>
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --ink:#17221d; --ink-2:#4b5a53; --ink-3:#7d8b84;
  --line:#d5ddd8; --soft:#e3e9e5;
  --l2:#2f9e44; --l3:#f26a1b; --l3-ink:#b34708;
  --open:#1f8a4c; --closed:#b3413a; --soon:#b7791f;
  --road:#c9d2cc; --stream:#8cc3e3; --map:#e8ece9;
  --shadow:0 6px 24px rgba(20,35,28,.16);
  --f-disp:"Black Han Sans","Noto Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111815; --panel:#18211d; --ink:#e7eeea; --ink-2:#a9b8b0; --ink-3:#74847c;
  --line:#2c3833; --soft:#212c27; --l3-ink:#ff9a5c;
  --open:#4cc57f; --closed:#ec7a72; --soon:#e3b04f;
  --road:#34423c; --stream:#2d5f7c; --map:#151d19; --shadow:0 6px 24px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111815; --panel:#18211d; --ink:#e7eeea; --ink-2:#a9b8b0; --ink-3:#74847c;
  --line:#2c3833; --soft:#212c27; --l3-ink:#ff9a5c;
  --open:#4cc57f; --closed:#ec7a72; --soon:#e3b04f;
  --road:#34423c; --stream:#2d5f7c; --map:#151d19; --shadow:0 6px 24px rgba(0,0,0,.5);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:380px 1fr;height:100%;min-height:560px}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
header.top{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.lines{display:flex}
.lines span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px/1 var(--f-body);border:2px solid var(--panel)}
.lines span+span{margin-left:-7px}
.lines .b2{background:var(--l2)} .lines .b3{background:var(--l3)}
h1{margin:0;font:400 26px/1.1 var(--f-disp);letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-2);font-size:13px;margin:0}
.sub b{color:var(--ink);font-weight:600}
.clock{font:500 12px/1 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.controls{display:grid;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);font:500 12.5px/1 var(--f-body);padding:7px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.row select{font:500 12.5px var(--f-body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.count{margin-left:auto;font:500 12px var(--f-mono);color:var(--ink-3)}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0}
#list li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:12px 20px;border-bottom:1px solid var(--soft);cursor:pointer}
#list li:hover,#list li.hl{background:var(--soft)}
#list li.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--l3)}
#list li:focus-visible{outline:2px solid var(--l3);outline-offset:-2px}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--f-mono);color:#fff}
.nm{font-weight:700;font-size:14.5px}
.meta{color:var(--ink-2);font-size:12.5px}
.dist{font:500 12px var(--f-mono);color:var(--ink-3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:700 11px/1 var(--f-body);padding:4px 7px;border-radius:4px;margin-top:4px;letter-spacing:.02em}
.pill.open{color:var(--open);background:color-mix(in srgb,var(--open) 14%,transparent)}
.pill.closed{color:var(--closed);background:color-mix(in srgb,var(--closed) 14%,transparent)}
.pill.soon{color:var(--soon);background:color-mix(in srgb,var(--soon) 16%,transparent)}
.pill.brk{color:var(--soon);background:color-mix(in srgb,var(--soon) 16%,transparent)}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--map)}
.leaflet-container{font-family:var(--f-body);background:var(--map)}
.legend{position:absolute;left:12px;bottom:12px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2);max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .15s}
.pin b{transform:rotate(45deg);color:#fff;font:700 11px/1 var(--f-mono)}
.pin.dim{opacity:.35}
.pin.big{transform:rotate(-45deg) scale(1.25)}
.home{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:400 12px/1 var(--f-disp);border:3px solid var(--l3);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.stn{display:flex;align-items:center;gap:4px;white-space:nowrap;font:600 11px/1 var(--f-body);color:var(--ink-2);text-shadow:0 0 3px var(--map),0 0 3px var(--map)}
.stn i{width:9px;height:9px;border-radius:50%;background:var(--panel);border:2.5px solid var(--ink-3);flex:none}
.ring-label{font:500 10.5px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap;text-shadow:0 0 3px var(--map),0 0 3px var(--map)}
.leaflet-tooltip.tip{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;width:260px;white-space:normal;font-size:12.5px}
.leaflet-tooltip.tip:before{display:none}
.tip h3{margin:0 0 2px;font-size:15px}
.tip .meta{margin-bottom:6px}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0}
.tip dt{color:var(--ink-3)} .tip dd{margin:0;font-variant-numeric:tabular-nums}
.tip .desc{margin:8px 0 0;color:var(--ink-2)}
.tip .hint{margin-top:8px;font-size:11.5px;color:var(--l3-ink);font-weight:600}
/* detail drawer */
#detail{position:absolute;top:12px;right:12px;bottom:12px;width:340px;max-width:calc(100% - 24px);z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
#detail .dh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px;position:relative}
#detail h2{margin:0;font:400 24px/1.15 var(--f-disp);padding-right:36px;text-wrap:balance}
#detail .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:18px;line-height:1}
#detail .db{padding:14px 18px;overflow-y:auto;display:grid;gap:16px;align-content:start}
#detail h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.menu{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.menu li{display:flex;gap:8px;align-items:baseline}
.menu li span:first-child{white-space:nowrap}
.menu .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px)}
.menu .pr{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.week{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12.5px;font-variant-numeric:tabular-nums}
.week dt{color:var(--ink-3)} .week dd{margin:0}
.week .today{font-weight:700;color:var(--ink)}
.actions{display:grid;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font:700 14px/1 var(--f-body);padding:12px;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:transparent}
.btn.pri{background:var(--l3);border-color:var(--l3);color:#fff}
.btn:hover{filter:brightness(1.06)}
.btn:focus-visible,.chip:focus-visible,#detail .x:focus-visible{outline:2px solid var(--l3);outline-offset:2px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:11.5px;color:var(--ink-3);margin:0}
.resv{font-size:12.5px;color:var(--ink-2)}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 58vh auto;height:auto}
  aside{display:contents}
  header.top{order:1;background:var(--panel)} .controls{order:2;background:var(--panel)}
  .mapwrap{order:3;height:58vh}
  #list{order:4;background:var(--panel);overflow:visible}
  header.top,.controls,#list li{padding-left:16px;padding-right:16px}
  #detail{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:78vh;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}
</style>

  <aside>
    <header class="top">

const STREAM = [[37.5693,126.9779],[37.5690,126.9830],[37.5690,126.9900],[37.5689,126.9960],[37.5687,127.0030],[37.5690,127.0100],[37.5700,127.0180],[37.5712,127.0250]];

// ---------- time helpers (KST) ----------
const DAYS = ["월","화","수","목","금","토","일"];
function kstNow(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false})
    .formatToParts(new Date()).map(x=>[x.type,x.value]));
  const wd = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[p.weekday];
  const h = parseInt(p.hour,10)%24, m = parseInt(p.minute,10);
  return { wd, min: h*60+m, label: `${DAYS[wd]}요일 ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}` };
}
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
function span(s){ const [a,b] = s.split("-"); let e = toMin(b); const st = toMin(a); if (e <= st) e += 1440; return [st,e]; }
function status(r, now){
  const t = now.min, today = r.h[now.wd], yest = r.h[(now.wd+6)%7];
  if (yest){ const [s,e] = span(yest); if (e > 1440 && t < e-1440) return {k:"open", t:`영업중 · ${fmt(e-1440)} 마감`}; }
  if (!today) return {k:"closed", t:"오늘 휴무"};
  const [s,e] = span(today);
  if (s === 0 && e === 1440) return {k:"open", t:"24시간 영업"};
  if (t < s) return {k:"closed", t:`${fmt(s)} 오픈`};
  if (t >= e) return {k:"closed", t:"영업 종료"};
  if (r.brk){ const [bs,be] = span(r.brk); if (t >= bs && t < be) return {k:"brk", t:`브레이크 · ${fmt(be)} 재개`}; }
  if (e - t <= 60) return {k:"soon", t:`곧 마감 · ${fmt(e)}`};
  return {k:"open", t:`영업중 · ${fmt(e)} 마감`};
}
const fmt = m => `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
function dist(a,b){
  const R0 = 6371000, rad = x => x*Math.PI/180;
  const dLat = rad(b.lat-a.lat), dLng = rad(b.lng-a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R0*Math.asin(Math.sqrt(s));
}
const distLabel = d => d < 1000 ? `${Math.round(d/10)*10}m` : `${(d/1000).toFixed(1)}km`;
const walk = d => `도보 ${Math.max(1,Math.round(d*1.25/75))}분`;
R.forEach(r => r.d = dist(HOME, r));

// links: 메뉴·예약은 네이버 지도 플레이스, 보조로 카카오맵
const naver = r => `https://map.naver.com/p/search/${encodeURIComponent(r.n)}`;
const kakao = r => `https://map.kakao.com/?q=${encodeURIComponent(r.n)}`;
const catchtable = r => `https://app.catchtable.co.kr/ct/search/total?keyword=${encodeURIComponent(r.n)}`;

// ---------- state ----------
const state = { cat:"all", openOnly:false, resvOnly:false, radius:3000, sel:null };
try { const s = JSON.parse(localStorage.getItem("euljiro-lunch")||"{}"); Object.assign(state, s, {sel:null}); } catch(e){}
const save = () => { try { localStorage.setItem("euljiro-lunch", JSON.stringify({cat:state.cat,openOnly:state.openOnly,resvOnly:state.resvOnly,radius:state.radius})); } catch(e){} };

// ---------- map ----------
const map = L.map("map", { zoomControl:true, attributionControl:true }).setView([HOME.lat, HOME.lng], 15);
const dark = () => document.documentElement.dataset.theme === "dark" ||
  (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
const tiles = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark()?"dark_all":"light_all"}/{z}/{x}/{y}{r}.png`, {
  maxZoom: 19, subdomains:"abcd",
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
}).addTo(map);

// 타일을 불러올 수 없는 환경(오프라인·샌드박스)에서는 직접 그린 약도로 대체
const base = L.layerGroup();
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function drawBase(){
  base.clearLayers();
  L.polyline(STREAM, { color: css("--stream"), weight: 6, opacity:.9, interactive:false }).addTo(base);
  ROADS.forEach(rd => {
    L.polyline(rd.pts, { color: css("--road"), weight: 5, interactive:false }).addTo(base);
    const mid = rd.pts[Math.floor(rd.pts.length/2)-1] || rd.pts[0];
    const nx = rd.pts[Math.floor(rd.pts.length/2)];
    L.marker([(mid[0]+nx[0])/2, (mid[1]+nx[1])/2], { interactive:false,
      icon: L.divIcon({ className:"", html:`<span class="ring-label">${rd.name}</span>`, iconSize:[0,0] }) }).addTo(base);
  });
  L.marker([37.5693,126.9935], { interactive:false, icon:L.divIcon({className:"",html:`<span class="ring-label" style="color:var(--stream)">청계천</span>`,iconSize:[0,0]}) }).addTo(base);
  STATIONS.forEach(([nm,lat,lng,ls]) => {
    L.marker([lat,lng], { interactive:false, icon: L.divIcon({ className:"", iconSize:[0,0], iconAnchor:[5,5],
      html:`<span class="stn"><i style="border-color:${LINE_COLOR[ls[0]]}"></i>${nm}</span>` }) }).addTo(base);
  });
}
let tileFails = 0, usingBase = false;
tiles.on("tileerror", () => {
  if (usingBase || ++tileFails < 3) return;
  usingBase = true; map.removeLayer(tiles); drawBase(); base.addTo(map); base.eachLayer(l => l.bringToBack && l.bringToBack());
  map.attributionControl.setPrefix("약도 모드 · 도로 위치는 대략적");
});

// radius rings
const rings = L.layerGroup().addTo(map);
[500,1000,2000,3000].forEach(m => {
  L.circle([HOME.lat,HOME.lng], { radius:m, color: m===3000? "#f26a1b" : "#7d8b84", weight: m===3000?2:1,
    dashArray: m===3000? null : "4 6", fill: m===3000, fillOpacity:.03, interactive:false }).addTo(rings);
  const lat = HOME.lat + m/111320;
  L.marker([lat, HOME.lng], { interactive:false, icon:L.divIcon({className:"",iconSize:[0,0],iconAnchor:[14,8],
    html:`<span class="ring-label">${m>=1000?m/1000+"km":m+"m"}</span>`}) }).addTo(rings);
});
L.marker([HOME.lat,HOME.lng], { zIndexOffset:1000, keyboard:false,
  icon:L.divIcon({ className:"", html:`<div class="home" title="르네스퀘어">회사</div>`, iconSize:[34,34], iconAnchor:[17,17] }) })
  .bindTooltip(`<h3>르네스퀘어</h3><div class="meta">서울 중구 충무로9길 38-5 (수표동)<br>을지로3가역 도보권 · 기준 위치</div>`, { className:"tip", direction:"top", offset:[0,-18] })
  .addTo(map);

// restaurant markers
const markers = {};
function pinIcon(r, cls=""){
  return L.divIcon({ className:"", iconSize:[26,26], iconAnchor:[13,26], tooltipAnchor:[0,-26],
    html:`<div class="pin ${cls}" style="background:${CATS[r.c].color}"><b>${r.id}</b></div>` });
}
function weekRows(r, now){
  return r.h.map((v,i)=>`<dt${i===now.wd?' class="today"':''}>${DAYS[i]}</dt><dd${i===now.wd?' class="today"':''}>${v ? (v==="00:00-24:00"?"24시간":v.replace("-"," – ")) : "휴무"}</dd>`).join("");
}
function tipHTML(r){
  const now = kstNow(), st = status(r, now), today = r.h[now.wd];
  return `<h3>${r.n}</h3>
    <div class="meta">${CATS[r.c].label} · ${distLabel(r.d)} · ${walk(r.d)}</div>
    <span class="pill ${st.k}">${st.t}</span>
    <dl>
      <dt>오늘</dt><dd>${today ? (today==="00:00-24:00"?"24시간":today.replace("-"," – ")) : "휴무"}</dd>
      ${r.brk?`<dt>브레이크</dt><dd>${r.brk.replace("-"," – ")}</dd>`:""}
      <dt>가격대</dt><dd>${r.price}</dd>
      <dt>대표</dt><dd>${r.menu[0][0]}</dd>
      <dt>예약</dt><dd>${r.resv?"가능":"불가 · 현장 대기"}</dd>
    </dl>
    <p class="desc">${r.desc}</p>
    <div class="hint">클릭하면 메뉴와 예약 링크를 볼 수 있어요</div>`;
}
R.forEach(r => {
  const m = L.marker([r.lat, r.lng], { icon: pinIcon(r), title: r.n, riseOnHover:true })
    .bindTooltip(() => tipHTML(r), { className:"tip", direction:"top", offset:[0,-4], opacity:1 })
    .on("click", () => select(r.id, false))
    .on("mouseover", () => hl(r.id, true)).on("mouseout", () => hl(r.id, false));
  markers[r.id] = m;
});

// ---------- UI ----------
const $ = s => document.querySelector(s);
const catsEl = $("#cats");
[["all","전체"], ...Object.entries(CATS).map(([k,v])=>[k,v.label])].forEach(([k,label]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.dataset.cat = k; b.id = "cat-"+k;
  b.innerHTML = k==="all" ? label : `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CATS[k].color};margin-right:5px"></span>${label}`;
  b.onclick = () => { state.cat = k; save(); render(); };
  catsEl.append(b);
});
$("#legend").innerHTML = Object.values(CATS).map(c=>`<span><i style="background:${c.color}"></i>${c.label}</span>`).join("") +
  `<span><i style="background:var(--ink);border-radius:2px;outline:2px solid #f26a1b"></i>르네스퀘어</span>`;
$("#openOnly").onchange = e => { state.openOnly = e.target.checked; save(); render(); };
$("#resvOnly").onchange = e => { state.resvOnly = e.target.checked; save(); render(); };
$("#radius").onchange = e => { state.radius = +e.target.value; save(); render(); };

function visible(now){
  return R.filter(r => (state.cat==="all" || r.c===state.cat) && r.d <= state.radius
    && (!state.openOnly || ["open","soon"].includes(status(r,now).k))
    && (!state.resvOnly || r.resv)).sort((a,b)=>a.d-b.d);
}
function render(){
  const now = kstNow();
  $("#clock").textContent = `지금 ${now.label} (KST) 기준 영업 상태`;
  catsEl.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat===state.cat));
  $("#openOnly").checked = state.openOnly; $("#resvOnly").checked = state.resvOnly; $("#radius").value = state.radius;
  const vis = visible(now), ids = new Set(vis.map(r=>r.id));
  R.forEach(r => { const m = markers[r.id]; if (ids.has(r.id)) { if (!map.hasLayer(m)) m.addTo(map); } else if (map.hasLayer(m)) map.removeLayer(m); });
  $("#count").textContent = `${vis.length}곳`;
  $("#list").innerHTML = vis.length ? vis.map(r => { const st = status(r, now); return `
    <li data-id="${r.id}" tabindex="0" class="${state.sel===r.id?"sel":""}">
      <span class="num" style="background:${CATS[r.c].color}">${r.id}</span>
      <div><div class="nm">${r.n}</div><div class="meta">${CATS[r.c].label} · ${r.menu[0][0]} · ${r.price}</div>
        <span class="pill ${st.k}">${st.t}</span></div>
      <div class="dist">${distLabel(r.d)}<br>${walk(r.d)}</div>
    </li>`; }).join("") : `<li style="cursor:default;display:block;color:var(--ink-3)">조건에 맞는 음식점이 없어요. 필터를 줄여보세요.</li>`;
  if (state.sel) showDetail(R.find(r=>r.id===state.sel));
}
$("#list").addEventListener("click", e => { const li = e.target.closest("li[data-id]"); if (li) select(+li.dataset.id, true); });
$("#list").addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && e.target.dataset.id){ e.preventDefault(); select(+e.target.dataset.id, true); } });
$("#list").addEventListener("mouseover", e => { const li = e.target.closest("li[data-id]"); if (li) { hl(+li.dataset.id, true); markers[+li.dataset.id].openTooltip(); } });
$("#list").addEventListener("mouseout", e => { const li = e.target.closest("li[data-id]"); if (li) { hl(+li.dataset.id, false); markers[+li.dataset.id].closeTooltip(); } });

function hl(id, on){
  const r = R.find(x=>x.id===id); if (!r) return;
  markers[id].setIcon(pinIcon(r, on || state.sel===id ? "big" : ""));
  const li = document.querySelector(`#list li[data-id="${id}"]`); if (li) li.classList.toggle("hl", on);
}
function select(id, fly){
  const prev = state.sel; state.sel = id;
  if (prev && prev!==id) hl(prev, false);
  const r = R.find(x=>x.id===id);
  hl(id, true);
  if (fly) map.flyTo([r.lat, r.lng], Math.max(map.getZoom(), 16), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : .6 });
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("sel", +li.dataset.id===id));
  showDetail(r);
}
function showDetail(r){
  const now = kstNow(), st = status(r, now), el = $("#detail");
  el.innerHTML = `
    <div class="dh">
      <h2>${r.n}</h2>
      <div class="meta">${CATS[r.c].label} · 르네스퀘어에서 ${distLabel(r.d)} (${walk(r.d)})</div>
      <div><span class="pill ${st.k}">${st.t}</span></div>
      <button class="x" id="closeDetail" aria-label="닫기">×</button>
    </div>
    <div class="db">
      <p class="desc" style="margin:0;color:var(--ink-2)">${r.desc}</p>
      <div><h4>대표 메뉴 · 가격 참고용</h4><ul class="menu">${r.menu.map(([a,p])=>`<li><span>${a}</span><span class="dots"></span><span class="pr">${p}원</span></li>`).join("")}</ul></div>
      <div><h4>영업시간</h4><dl class="week">${weekRows(r, now)}${r.brk?`<dt>브레이크</dt><dd>${r.brk.replace("-"," – ")}</dd>`:""}</dl></div>
      <div><h4>예약</h4><div class="resv">${r.resv ? "네이버 예약·전화 예약 가능 (점심 단체는 미리 예약 권장)" : "예약을 받지 않는 곳이에요. 11:30 이전 방문하면 대기가 짧아요."}</div></div>
      <p class="note">메뉴 가격과 영업시간은 가게 사정으로 바뀔 수 있어요. 방문 전 지도 앱에서 최신 정보를 확인하세요.</p>
    </div>
    <div class="actions">
      <a class="btn pri" href="${naver(r)}" target="_blank" rel="noopener">${r.resv ? "예약하기 · 네이버 플레이스" : "메뉴·대기 정보 · 네이버 플레이스"}</a>
      <div class="btn-row">
        <a class="btn" href="${naver(r)}" target="_blank" rel="noopener">전체 메뉴 보기</a>
        <a class="btn" href="${r.resv ? catchtable(r) : kakao(r)}" target="_blank" rel="noopener">${r.resv ? "캐치테이블" : "카카오맵"}</a>
      </div>
    </div>`;
  el.hidden = false;
  $("#closeDetail").onclick = () => { const id = state.sel; state.sel = null; el.hidden = true; hl(id, false); document.querySelectorAll("#list li.sel").forEach(li=>li.classList.remove("sel")); };
}
document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("#detail").hidden) $("#closeDetail").click(); });

render();
setInterval(render, 60000);
</script>
</body>
</html>
